{% extends 'base.html' %}

{% block title %}500 - Internal Server Error{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <div class="display-1 text-danger fw-bold mb-2">500</div>
        <h3 class="fw-bold mb-3">Internal Server Error</h3>
        <p class="text-muted max-w-md mx-auto mb-4">
            Something unexpected occurred on our end while processing your request. Please try again in a few moments.
        </p>
        <div class="d-flex justify-content-center gap-3">
            <a href="{{ url_for('index') }}" class="btn btn-primary rounded-pill px-4">
                <i class="bi bi-house me-1"></i> Return to Homepage
            </a>
            <a href="{{ url_for('contact') }}" class="btn btn-outline-danger rounded-pill px-4">
                <i class="bi bi-headset me-1"></i> Contact Support
            </a>
        </div>
    </div>
</div>
{% endblock %}
