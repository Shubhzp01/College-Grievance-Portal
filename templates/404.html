{% extends 'base.html' %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <div class="display-1 text-primary fw-bold mb-2">404</div>
        <h3 class="fw-bold mb-3">Oops! Page Not Found</h3>
        <p class="text-muted max-w-md mx-auto mb-4">
            The page you are looking for might have been moved, deleted, or does not exist on the College Grievance Portal.
        </p>
        <div class="d-flex justify-content-center gap-3">
            <a href="{{ url_for('index') }}" class="btn btn-primary rounded-pill px-4">
                <i class="bi bi-house me-1"></i> Return to Homepage
            </a>
            <a href="{{ url_for('track_complaint') }}" class="btn btn-outline-secondary rounded-pill px-4">
                <i class="bi bi-search me-1"></i> Track a Complaint
            </a>
        </div>
    </div>
</div>
{% endblock %}
